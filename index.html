<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131f">
  <title>Test Portal | Bare Minimum Edition</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131f;
      color: #f5f4ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(ellipse at 18% 18%, rgb(118 92 255 / 22%), transparent 42%),
        radial-gradient(ellipse at 85% 82%, rgb(40 210 180 / 12%), transparent 38%),
        #10131f;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 28px;
      background: rgb(255 255 255 / 5%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      backdrop-filter: blur(14px);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.8rem;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 999px;
      color: #c5c0e8;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .badge::before {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #70e1bd;
      box-shadow: 0 0 12px #70e1bd;
      content: "";
    }

    h1 {
      margin: 1.6rem 0 1rem;
      font-size: clamp(2.6rem, 9vw, 5rem);
      line-height: 0.98;
      letter-spacing: -0.07em;
    }

    h1 span {
      display: block;
      color: #a99bff;
    }

    p {
      max-width: 42ch;
      margin: 0 auto;
      color: #b6b5c7;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.75;
    }

    .note {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgb(255 255 255 / 10%);
      color: #79798d;
      font-size: 0.82rem;
    }

    .note strong { color: #d3ceef; }
  </style>
</head>
<body>
  <main>
    <div class="badge">A fully intentional product decision</div>
    <h1>Test Portal<span>™</span></h1>
    <p>We could have made this page more useful. But that sounded like work, so here we are. Please enjoy our carefully selected amount of effort.</p>
    <div class="note"><strong>Built with passion.</strong> And a suspiciously small number of CSS rules.</div>
  </main>
</body>
</html>
